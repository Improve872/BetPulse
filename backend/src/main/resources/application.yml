spring:
  application:
    name: betpulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/betpulse}
    username: ${DB_USER:betpulse}
    password: ${DB_PASSWORD:betpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
