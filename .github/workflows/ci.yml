name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  collector:
    name: Collector build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build collector
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  docker:
    name: Docker demo images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo images
        run: |
          docker compose \
            --env-file infra/demo.env.example \
            -f infra/docker-compose.demo.yml \
            build

  e2e:
    name: E2E money flow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: betpulse
          POSTGRES_USER: betpulse
          POSTGRES_PASSWORD: betpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betpulse -d betpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/betpulse
          DB_USER: betpulse
          DB_PASSWORD: betpulse
          INGEST_SECRET: betpulse-dev-ingest-secret
          OPENDOTA_SCHEDULER_ENABLED: "false"
          OPENDOTA_RESULT_SCHEDULER_ENABLED: "false"
          ESPN_SCHEDULER_ENABLED: "false"
          FOOTBALL_SCHEDULER_ENABLED: "false"
          BASKETBALL_SCHEDULER_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
        run: |
          nohup java -jar target/betpulse-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8081
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8081
        run: |
          nohup npm start > frontend.log 2>&1 &
      - name: Wait for stack
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend log:"
          cat backend/backend.log
          echo "frontend log:"
          cat frontend/frontend.log
          exit 1
      - name: Run E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_BACKEND_URL: http://127.0.0.1:8081
          E2E_INGEST_SECRET: betpulse-dev-ingest-secret
        run: npx playwright test
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
