name: betpulse-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-betpulse}
      POSTGRES_USER: ${POSTGRES_USER:-betpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betpulse}
    volumes:
      - betpulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-betpulse} -d ${POSTGRES_DB:-betpulse}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-betpulse-backend:demo}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-betpulse}
      DB_USER: ${POSTGRES_USER:-betpulse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-betpulse}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@betpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrador}
      SESSION_COOKIE_SECURE: "false"
      OPENDOTA_API_KEY: ${OPENDOTA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8081/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-betpulse-frontend:demo}
    ports:
      - "${DEMO_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: unless-stopped

volumes:
  betpulse-pgdata:
